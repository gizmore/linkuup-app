<section class="nearby" layout="row" flex ng-cloak>

	<ng-include class="left-sidebar" src="'js/pages/sidenav/lup-sidenav.html?v='+V"></ng-include>

	<md-content class="greybg" flex>
	
		<ng-include src="'js/pages/locations/header-bar-locations.html?v='+V"></ng-include>
		
		<div class="search-input-wrap">
			<input
			type="text" class="search-input" placeholder="{{'SEARCH_FOR_LOCATIONS'|translate}}"
			ng-change="searchLocation(data.searchvalue)" ng-model="data.searchvalue" />
		</div>

		<div class="location-categories" aria-label="Kategorien">
			<button type="button" ng-class="{active: isCategoryActive([])}" ng-click="selectCategory([])"><i class="material-icons">apps</i><span>Alle</span></button>
			<button type="button" ng-class="{active: isCategoryActive(['2'])}" ng-click="selectCategory(['2'])"><i class="material-icons">apartment</i><span>Städte<br>&amp; Länder</span></button>
			<button type="button" ng-class="{active: isCategoryActive(['3','4','5','14'])}" ng-click="selectCategory(['3','4','5','14'])"><i class="material-icons">storefront</i><span>Bar<br>&amp; Café</span></button>
			<button type="button" ng-class="{active: isCategoryActive(['11'])}" ng-click="selectCategory(['11'])"><i class="material-icons">music_note</i><span>Club<br>&amp; Disco</span></button>
			<button type="button" ng-class="{active: isCategoryActive(['12','16','17'])}" ng-click="selectCategory(['12','16','17'])"><i class="material-icons">school</i><span>Bildung<br>&amp; Kultur</span></button>
			<button type="button" ng-class="{active: isCategoryActive(['13','18'])}" ng-click="selectCategory(['13','18'])"><i class="material-icons">sports_soccer</i><span>Sport<br>&amp; Freizeit</span></button>
		</div>

		<div class="location-rail" aria-label="{{'LOCATIONS'|translate}}">
			<div ng-repeat="room in data.visibleRooms" class="lup-room-slide-outer"
					 ng-attr-data-room-id="{{room.id()}}" ng-attr-data-room-category="{{room.category()}}">
	
				<div id="room{{room.id()}}" class="lup-room-slide" flex layout-fill layout="column">
					<!-- Ortsrad: the existing room actions stay intact; only their visual
					     hierarchy changes from a card into one navigable location instrument. -->
					<article class="lup-orbit-card" ng-class="[categoryVisual(room).class, {'lup-orbit-card--live': room.inChatRange()}]">
						<div class="lup-orbit-card__dial" aria-hidden="true">
							<span></span><span></span><span></span><span></span><span></span><span></span>
						</div>
						<header class="lup-orbit-card__signage">
							<span class="lup-orbit-card__category">{{room.categoryName()}}</span>
							<button type="button" class="lup-orbit-card__identity" ng-click="maybeGotoRoom(room, $event)" aria-label="Ort öffnen: {{room.name()}}">
								<strong ng-class="roomNameClass(room)">{{room.name()}}</strong>
								<span><i class="material-icons">place</i>{{room.city() || 'LinkUUp Ort'}}</span>
								<i class="material-icons lup-orbit-card__open-mark" aria-hidden="true">arrow_outward</i>
							</button>
						</header>
						<a class="lup-orbit-card__route" ng-href="{{mapsHref(room)}}" target="_blank" rel="noopener" title="{{'NAVIGATE_TO_THIS_PLACE'|translate}}" ng-click="requestLocation(room, $event)">
							<span class="lup-orbit-card__needle"><i class="material-icons">{{categoryVisual(room).icon}}</i></span>
							<span class="lup-orbit-card__distance"><i class="material-icons">near_me</i><strong ng-if="room.showDistance()">{{room.displayDistance()}}</strong><strong ng-if="!room.showDistance()">Ort öffnen</strong><small>Route ansehen</small></span>
						</a>
						<section class="lup-orbit-card__presence" aria-label="Gäste an diesem Ort">
							<div class="lup-orbit-card__people" ng-class="{'has-overflow': room.USERS.length > 10}">
								<lup-avatar ng-repeat="user in sortedVisitors(room) | limitTo: 10" ng-click="gotoProfile(user)" ng-user="user"></lup-avatar>
								<button type="button" ng-if="room.USERS.length>10" ng-click="gotoVisitors(room)" title="Alle Anwesenden anzeigen">+{{visitorOverflowLabel(room)}}</button>
							</div>
							<button type="button" class="lup-orbit-card__people-label" ng-class="{'has-visitors': room.USERS.length > 0}" ng-click="gotoVisitors(room)">
								<span></span><b>{{visitorCountLabel(room)}}</b> gerade hier
							</button>
						</section>
						<footer class="lup-orbit-card__entry" ng-class="{'lup-orbit-card__entry--locked': !room.inChatRange()}">
							<button type="button" class="lup-orbit-card__seal" ng-click="showRoomQRCode(room, $event)" title="{{'QR_ROOM_DIALOG_TITLE'|translate}}" aria-label="{{'QR_ROOM_DIALOG_TITLE'|translate}}"><i class="material-icons">qr_code_2</i></button>
							<button type="button" class="lup-orbit-card__gate" ng-if="room.inChatRange()" ng-click="enterChatDoor(room)" aria-label="{{'JOIN_CHAT'|translate}}"><i class="material-icons">forum</i></button>
							<div class="lup-orbit-card__lock" ng-if="!room.inChatRange()" title="{{'CHAT_TOO_FAR'|translate}}" aria-label="{{'CHAT_TOO_FAR'|translate}}"><i class="material-icons">lock</i></div>
						</footer>
					</article>
	
				</div>
	
			</div>
		</div>

	</md-content>

</section>
